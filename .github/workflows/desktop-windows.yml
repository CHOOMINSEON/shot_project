name: Windows portable app

on:
  workflow_dispatch:
  push:
    branches: [codex/free-test-package]
    paths:
      - '.github/workflows/desktop-windows.yml'
      - 'desktop/**'
      - 'studio/**'
      - 'scripts/download_model.py'
      - 'requirements*'
      - 'tests/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      STUDIO_DATA_DIR: ".desktop-data-한국어-o'neil"
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime and packager
        run: |
          python -m pip install -r requirements.lock pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and prepare FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-full.7z'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build.7z' -OutFile $archive
          $expected = 'f0e46253c70dfe902bac915dfb4224f0cf1b7c6eeab9da2ccc9a5581f9a71b13'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'FFmpeg SHA-256 mismatch' }
          New-Item -ItemType Directory -Force desktop/vendor | Out-Null
          7z x -y $archive '-odesktop/vendor' | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Get-ChildItem desktop/vendor -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw 'FFmpeg binary missing' }
          $bin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $bin.Directory.Parent.FullName | Out-File -FilePath 'desktop/vendor/location.txt' -Encoding utf8
      - name: Test Windows processing and authentication
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and validate medium model for packaged test
        run: |
          python scripts/download_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build single executable
        shell: pwsh
        run: |
          $ffmpeg = (Get-Content desktop/vendor/location.txt -Raw).Trim()
          python -m PyInstaller --noconfirm --clean --onefile --console --name IyoringCutStudio --paths . --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all tokenizers --collect-all av --collect-all huggingface_hub --collect-submodules uvicorn --add-data 'web;web' --add-data "$ffmpeg;ffmpeg" desktop/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the packaged executable
        shell: pwsh
        run: |
          # Prove FFmpeg comes from the executable, not the runner's build directory.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process -FilePath (Resolve-Path 'dist/IyoringCutStudio.exe') -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged executable test failed: $($process.ExitCode)" }
      - name: Publish verified free download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = '${{ github.sha }}'.Substring(0, 8)
          $tag = "desktop-windows-$short"
          $hash = (Get-FileHash dist/IyoringCutStudio.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  IyoringCutStudio.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii
          Copy-Item desktop/README.md dist/사용방법.md
          @'
          Windows 10/11 x64에서 IyoringCutStudio.exe를 내려받아 더블클릭하세요. Docker/Python/FFmpeg 별도 설치 없이 브라우저가 열립니다. 최초 실행에는 한국어 medium 모델 약 1.5GB 자동 다운로드가 필요합니다.

          실제 Windows 테스트와 실행 파일 자체의 모델·인증·업로드·MP4 출력 검증이 통과한 빌드입니다. 사용자 PC용 앱이며 인터넷 공개 사이트 배포와 다릅니다. 원본 최대 10GB·2시간, 실제 전체 부하 검증은 미수행입니다.
          '@ | Out-File -FilePath dist/release-notes.md -Encoding utf8
          gh release create $tag dist/IyoringCutStudio.exe dist/SHA256SUMS.txt dist/사용방법.md --repo '${{ github.repository }}' --target '${{ github.sha }}' --title '이요링 컷 스튜디오 · Windows 바로 실행' --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
